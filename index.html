<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Malicious Software – Activity Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Minimalist, maroon, always light. */
:root{
  color-scheme:light;
  --bg:#faf7f6; --surface:#ffffff; --surface-2:#f4edee; --border:#eadfe0; --border-2:#ddcdcf; --line:#e7dedf;
  --text:#231a1c; --muted:#6f6065; --faint:#9a8d90;
  --primary:#7a1f2e; --primary-dark:#5c1623; --primary-soft:#f6eaec; --primary-ink:#ffffff; --accent:#a84050;
  --good:#1f6b4a; --good-soft:#eaf4ef; --bad:#a3231c; --bad-soft:#fbeeec; --warn:#7a5a12; --warn-soft:#f8f1df;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:light;
  --bg:#faf7f6; --surface:#ffffff; --surface-2:#f4edee; --border:#eadfe0; --border-2:#ddcdcf; --line:#e7dedf;
  --text:#231a1c; --muted:#6f6065; --faint:#9a8d90;
  --primary:#7a1f2e; --primary-dark:#5c1623; --primary-soft:#f6eaec; --primary-ink:#ffffff; --accent:#a84050;
  --good:#1f6b4a; --good-soft:#eaf4ef; --bad:#a3231c; --bad-soft:#fbeeec; --warn:#7a5a12; --warn-soft:#f8f1df;}}
:root[data-theme="dark"]{color-scheme:light;
  --bg:#faf7f6; --surface:#ffffff; --surface-2:#f4edee; --border:#eadfe0; --border-2:#ddcdcf; --line:#e7dedf;
  --text:#231a1c; --muted:#6f6065; --faint:#9a8d90;
  --primary:#7a1f2e; --primary-dark:#5c1623; --primary-soft:#f6eaec; --primary-ink:#ffffff; --accent:#a84050;
  --good:#1f6b4a; --good-soft:#eaf4ef; --bad:#a3231c; --bad-soft:#fbeeec; --warn:#7a5a12; --warn-soft:#f8f1df;}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 72px);background:#faf7f6}
body{margin:0;min-height:100%;background:var(--bg);color:var(--text);
  font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:16.5px;line-height:1.6;-webkit-font-smoothing:antialiased;letter-spacing:-.003em}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
img,svg{max-width:100%}
h1,h2,h3,h4{margin:0 0 .5em;line-height:1.25;font-weight:700;letter-spacing:-.02em}
h1{font-size:clamp(1.8rem,4.6vw,2.6rem)}
h2{font-size:clamp(1.3rem,2.8vw,1.6rem)}
h3{font-size:1.1rem}
h4{font-size:.98rem;font-weight:600}
p{margin:0 0 .75em}
b,strong{font-weight:600}
.mono,code{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace}
code{font-size:.85em;background:var(--surface-2);border:1px solid var(--border);padding:.03em .35em;border-radius:5px;word-break:break-word}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:6px}
.wrap{max-width:760px;margin:0 auto;padding:22px 20px 72px}
.small{font-size:.88rem}.muted{color:var(--muted)}
.row{display:flex;align-items:center;gap:10px}.row.wrap{flex-wrap:wrap}.between{justify-content:space-between}.end{justify-content:flex-end}.center{justify-content:center}
.stack>*+*{margin-top:16px}
hr.sep{border:0;border-top:1px solid var(--line);margin:22px 0}

/* Top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(250,247,246,.9);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topbar-in{max-width:760px;margin:0 auto;padding:11px 20px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:9px;background:none;border:0;padding:0;cursor:pointer;color:var(--text);text-align:left}
.brand:disabled{cursor:default}
.brand-ic{width:26px;height:26px;border-radius:7px;background:var(--primary);color:var(--primary-ink);display:grid;place-items:center;font-size:14px;flex:none}
.brand-t{font-weight:700;font-size:.98rem;line-height:1}
.brand-t small{display:block;font-weight:400;font-size:.76rem;color:var(--muted);margin-top:2px}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:12px}
.tb-steps{font-size:.82rem;color:var(--muted);font-weight:600}
.tb-steps b{color:var(--primary)}
.student{font-size:.84rem;line-height:1.15;text-align:right}
.student small{display:block;color:var(--muted)}

/* Blocks */
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:clamp(18px,3.2vw,26px)}
.bare{padding:4px 0}
.eyebrow{font-size:.78rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-bottom:10px}
.lead{font-size:1.06rem;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--border);color:var(--muted)}
.pill.on{background:var(--primary-soft);border-color:var(--border-2);color:var(--primary)}
.rail{height:3px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.rail>i{display:block;height:100%;background:var(--primary);transition:width .4s ease}
.btn{appearance:none;border:1px solid var(--primary);border-radius:9px;padding:11px 18px;font-size:.96rem;font-weight:600;cursor:pointer;background:var(--primary);color:var(--primary-ink);display:inline-flex;align-items:center;justify-content:center;gap:7px;transition:background .18s,border-color .18s,color .18s}
.btn:hover{background:var(--primary-dark);border-color:var(--primary-dark)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-ghost{background:transparent;color:var(--primary);border-color:var(--border-2)}
.btn-ghost:hover{background:var(--primary-soft);border-color:var(--primary);color:var(--primary)}
.btn-quiet{background:transparent;color:var(--muted);border-color:var(--border)}
.btn-quiet:hover{background:var(--surface-2);color:var(--text)}
.btn-sm{padding:7px 13px;font-size:.88rem;border-radius:8px}
.field label{font-weight:600;font-size:.9rem;display:block;margin-bottom:6px}
.input,textarea.ta{font:inherit;padding:11px 13px;border-radius:9px;border:1px solid var(--border-2);background:var(--surface);color:var(--text);outline:none;width:100%;transition:border .18s}
.input:focus,textarea.ta:focus{border-color:var(--primary)}
textarea.ta{min-height:92px;resize:vertical;line-height:1.5}
.err{color:var(--bad);font-size:.88rem;font-weight:600;min-height:1.2em;margin-top:6px}

/* Welcome / overview */
.facts{list-style:none;padding:0;margin:14px 0 0;display:grid;gap:7px}
.facts li{display:flex;gap:9px;align-items:baseline;font-size:.96rem}
.facts li::before{content:"—";color:var(--accent);font-weight:700}
.axes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 2px}
.axis{border:1px solid var(--border);border-radius:11px;padding:13px 15px;background:var(--surface-2)}
.axis b{display:block;color:var(--primary);font-size:.95rem}
.axis span{font-size:.88rem;color:var(--muted)}
.who-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.obj{margin:0;padding:0;list-style:none;display:grid;gap:7px}
.obj li{display:flex;gap:10px;font-size:.96rem}
.obj li::before{content:counter(o);counter-increment:o;flex:none;width:22px;height:22px;border-radius:6px;background:var(--primary-soft);color:var(--primary);font-size:.78rem;font-weight:700;display:grid;place-items:center}
.obj{counter-reset:o}
.marks{width:100%;border-collapse:collapse;font-size:.92rem}
.marks th,.marks td{padding:9px 2px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.marks tr:last-child td{border-bottom:0}
.marks th{font-weight:600;color:var(--muted);font-size:.8rem;text-transform:uppercase;letter-spacing:.04em}
.path{display:grid;gap:10px}
.pcard{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;border:1px solid var(--border);border-radius:12px;padding:14px 16px;background:var(--surface)}
.pcard.locked{opacity:.55}
.pnum{width:30px;height:30px;border-radius:8px;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center;font-weight:700;font-size:.95rem}
.pcard.quiz .pnum{background:var(--primary);color:var(--primary-ink)}
.ptitle{font-weight:600;font-size:1rem}
.pmeta{font-size:.82rem;color:var(--muted);margin-top:2px}

/* Step */
.crumbs{font-size:.82rem;color:var(--muted);margin-bottom:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.steptitle{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.key{border-left:2px solid var(--primary);padding:4px 0 4px 14px;margin-top:14px;color:var(--text)}
.key b{color:var(--primary)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.box{border:1px solid var(--border);border-radius:11px;padding:13px 15px;background:var(--surface-2)}
.box h4{color:var(--primary);margin-bottom:3px}
.defn{display:grid;gap:8px;margin:10px 0}
.defn .d{border:1px solid var(--border);border-radius:11px;padding:11px 14px;font-size:.93rem}
.defn .d b{color:var(--primary)}
.warnline{background:var(--warn-soft);border:1px solid #ecdcae;border-radius:9px;padding:8px 12px;font-size:.88rem;margin-bottom:12px}
.actwrap{border:1px solid var(--border-2);border-radius:13px;padding:clamp(15px,3vw,22px);margin-top:4px;background:var(--surface)}
.act-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.act-label{font-size:.78rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.badge{display:none;font-size:.8rem;font-weight:600;color:var(--good);align-items:center;gap:5px}
.actwrap.done .badge{display:inline-flex}
.task{font-weight:600;font-size:.98rem;margin-bottom:12px}
.hintarea{margin-top:14px;padding-top:12px;border-top:1px dashed var(--border-2)}
.hintbox{background:var(--surface-2);border:1px solid var(--border);padding:9px 13px;border-radius:9px;margin-top:9px;font-size:.92rem;animation:fade .2s}
.fb{padding:11px 14px;border-radius:9px;margin-top:11px;font-size:.94rem;border:1px solid var(--border);background:var(--surface-2);animation:fade .2s}
.fb.good{background:var(--good-soft);border-color:#cfe6da;color:#15543a}
.fb.bad{background:var(--bad-soft);border-color:#eccbc8;color:#842019}
.fb .act-next{margin-top:9px}
.stepnav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:18px}
.dots{display:flex;gap:5px}
.dots i{width:7px;height:7px;border-radius:99px;background:var(--border-2);transition:.3s}
.dots i.ok{background:var(--accent)}
.dots i.on{width:20px;background:var(--primary)}
.part{margin:18px 0 8px;font-size:.98rem;font-weight:600;color:var(--primary)}
.part:first-child{margin-top:0}

/* Choice */
.cq-top{display:flex;align-items:center;gap:10px;font-size:.82rem;color:var(--muted)}
.cq-top .rail{flex:1}
.cq-q{font-size:1.02rem;margin:12px 0}
.opts{display:grid;gap:9px}
.opt{font-size:.96rem;font-weight:500;padding:11px 14px;border-radius:9px;border:1px solid var(--border-2);background:var(--surface);color:var(--text);cursor:pointer;text-align:left;line-height:1.4;transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--primary);background:var(--primary-soft)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--good);background:var(--good-soft);color:#15543a}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);color:#842019}

/* Flip */
.flips{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:11px}
.flip{perspective:900px;height:210px;cursor:pointer;border:0;background:none;padding:0;color:inherit;text-align:left}
.flip-in{position:relative;width:100%;height:100%;transition:transform .55s;transform-style:preserve-3d}
.flip.on .flip-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:12px;padding:15px;border:1px solid var(--border-2);display:flex;flex-direction:column;background:var(--surface)}
.front{align-items:flex-start;justify-content:center;gap:4px}
.flip:hover .front{border-color:var(--primary)}
.front .fk{font-weight:700;font-size:1.12rem;color:var(--primary)}
.front .fn{font-size:.86rem;color:var(--muted)}
.front .tap{margin-top:auto;font-size:.76rem;color:var(--faint)}
.back{background:var(--primary-soft);border-color:var(--border-2);transform:rotateY(180deg);font-size:.88rem;overflow:auto;gap:6px}
.back .bt{font-weight:600;color:var(--primary)}

/* Sort */
.sub{font-weight:600;font-size:.9rem;margin-bottom:8px;display:flex;gap:8px;align-items:center}
.pool{display:flex;flex-wrap:wrap;gap:7px;min-height:50px;padding:11px;border-radius:11px;background:var(--surface-2);border:1px dashed var(--border-2)}
.chip{font-size:.9rem;font-weight:500;padding:7px 12px;border-radius:8px;border:1px solid var(--border-2);background:var(--surface);color:var(--text);cursor:pointer;text-align:left;transition:.15s}
.chip:hover{border-color:var(--primary)}
.chip.sel{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.buckets{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-top:12px}
.bucket{text-align:left;cursor:pointer;border-radius:11px;border:1px solid var(--border-2);background:var(--surface);padding:11px 13px;min-height:108px;color:var(--text);display:flex;flex-direction:column;gap:5px;transition:.15s}
.bucket:hover{border-color:var(--primary);background:var(--surface-2)}
.bh{font-weight:600;font-size:.94rem;color:var(--primary)}
.placedlist{display:flex;flex-wrap:wrap;gap:4px}
.placed{font-size:.78rem;background:var(--good-soft);border:1px solid #cfe6da;border-radius:6px;padding:2px 7px;color:#15543a}

/* Order / sequence */
.order{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.events{display:grid;gap:7px}
.timeline{list-style:none;padding:0;margin:0;display:grid;gap:7px}
.tl-empty{border:1px dashed var(--border-2);border-radius:10px;padding:12px;color:var(--faint);font-size:.88rem;text-align:center}
.tl-item{display:flex;gap:10px;align-items:flex-start;background:var(--good-soft);border:1px solid #cfe6da;border-radius:10px;padding:9px 11px;font-size:.9rem;animation:fade .25s}
.tl-num{flex:none;width:22px;height:22px;border-radius:50%;background:var(--primary);color:var(--primary-ink);display:grid;place-items:center;font-size:.76rem;font-weight:700}
.tl-ph{font-size:.78rem;font-weight:600;color:var(--primary)}
.seq{display:grid;gap:8px;margin-top:4px}
.msg{border:1px solid var(--border);border-radius:10px;padding:10px 13px;background:var(--surface);animation:fade .3s}
.msg .d{font-size:.8rem;font-weight:600;color:var(--muted);margin-bottom:2px}
.msg .p{font-size:.94rem}
.msg.bad{background:var(--bad-soft);border-color:#eccbc8}
.msg.ok{background:var(--good-soft);border-color:#cfe6da}
.tasks{display:grid;gap:6px;margin-top:12px}
.tk{display:flex;gap:9px;align-items:center;font-size:.92rem;font-weight:500;color:var(--muted)}
.tick{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--border-2);display:grid;place-items:center;font-size:.72rem;flex:none;color:transparent;transition:.2s}
.tk.ok{color:var(--good)}.tk.ok .tick{background:var(--good);border-color:var(--good);color:#fff}

/* Lesson done + reflect + share */
.done-head{text-align:center;padding:6px 0 2px}
.check{width:46px;height:46px;border-radius:50%;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center;font-size:22px;margin:0 auto 10px}
.take{margin:0;padding:0;list-style:none;display:grid;gap:7px}
.take li{display:flex;gap:9px;font-size:.95rem}
.take li::before{content:"✓";color:var(--good);font-weight:700}
.reflect{border:1px solid var(--border-2);border-radius:12px;padding:16px;background:var(--surface-2)}
.reflect .prompt{font-weight:600;margin-bottom:4px}
.share-out{margin-top:10px}
.sharebox{width:100%;min-height:150px;font-family:"JetBrains Mono",monospace;font-size:.82rem;border-radius:10px;border:1px solid var(--border-2);padding:11px;background:var(--surface);color:var(--text);margin-top:10px;white-space:pre;overflow:auto}

/* Result */
.ring{width:140px;height:140px;border-radius:50%;background:conic-gradient(var(--primary) calc(var(--p)*1%),var(--surface-2) 0);display:grid;place-items:center;margin:0 auto}
.ring>div{width:112px;height:112px;border-radius:50%;background:var(--surface);display:grid;place-items:center;text-align:center;line-height:1}
.ring b{font-size:2.3rem;font-weight:700;color:var(--primary)}
.ring span{display:block;color:var(--muted);font-size:.9rem;margin-top:3px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:16px}
.kv div{border:1px solid var(--border);border-radius:9px;padding:8px 11px}
.kv small{display:block;color:var(--muted);font-size:.8rem}
.kv b{font-size:.98rem;font-weight:600;word-break:break-word}
.status-pass{color:var(--good)}.status-fail{color:var(--bad)}
.review{margin:0;padding:0;list-style:none;display:grid;gap:9px}
.review li{border:1px solid var(--border);border-radius:10px;padding:11px 13px;font-size:.92rem}
.review .yes{color:var(--good);font-weight:600}.review .no{color:var(--bad);font-weight:600}

/* Quiz */
.qprompt{font-size:1.1rem;margin:12px 0}
.qopts{display:grid;gap:9px}
.qopt{display:flex;gap:11px;align-items:center;text-align:left;font-size:.96rem;padding:11px 13px;border-radius:10px;border:1px solid var(--border-2);background:var(--surface);color:var(--text);cursor:pointer;transition:.15s}
.qopt:hover:not(:disabled){border-color:var(--primary);background:var(--surface-2)}
.qopt:disabled{cursor:default}
.ltr{width:27px;height:27px;border-radius:7px;background:var(--surface-2);display:grid;place-items:center;font-weight:700;font-size:.85rem;flex:none;border:1px solid var(--border)}
.qopt.sel{border-color:var(--primary);background:var(--primary-soft)}
.qopt.sel .ltr{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.qopt.right{border-color:var(--good);background:var(--good-soft)}
.qopt.right .ltr{background:var(--good);color:#fff}
.qopt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.qopt.wrong .ltr{background:var(--bad);color:#fff}

.foot{text-align:center;color:var(--faint);font-size:.82rem;padding:0 20px 28px}
.screen{animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.shake{animation:shake .35s}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:620px){
  .two,.axes,.who-grid,.order,.kv{grid-template-columns:1fr}
  .pcard{grid-template-columns:auto 1fr}
  .pcard .btn{grid-column:1/-1}
  .tb-steps{display:none}
}
</style>
</head>
<body>
<header class="topbar" id="topbar"></header>
<main id="app" class="wrap"></main>
<footer class="foot">Everything here is simulated for learning. Progress is saved in this browser only — on a shared computer, choose “Different student”.</footer>

<script>
(function(){
"use strict";
const rootEl = document.documentElement;
function forceLight(){ if(rootEl.getAttribute("data-theme") !== "light") rootEl.setAttribute("data-theme","light"); }
forceLight();
try{ new MutationObserver(forceLight).observe(rootEl,{attributes:true,attributeFilter:["data-theme"]}); }catch(e){}

const KEY = "mw-activity-lab-v1";
const TOTAL = 15;
const app = document.getElementById("app");
const topbar = document.getElementById("topbar");

function fresh(){ return { name:"", roll:"", maxPos:-1, done:{}, reflect:{}, results:[] }; }
let S = fresh();
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function load(){ try{ const v = localStorage.getItem(KEY); if(v){ const o = JSON.parse(v); if(o && typeof o==="object"){ S = Object.assign(fresh(), o); S.reflect = S.reflect || {}; } } }catch(e){} }
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function shake(el){ el.classList.remove("shake"); void el.offsetWidth; el.classList.add("shake"); }
function el(h){ const t=document.createElement("template"); t.innerHTML=h.trim(); return t.content.firstElementChild; }
function doneCount(){ return Object.keys(S.done).filter(k=>S.done[k]).length; }
let mode = "welcome";

/* ---------- builders ---------- */
function choiceQuiz(root, cfg){
  const items = cfg.items; let i=0, first=0, missed=false;
  const wrap = document.createElement("div"); root.appendChild(wrap);
  function show(){
    if(i >= items.length){ wrap.innerHTML = `<div class="fb good">All ${items.length} done — first-try correct: <b>${first} of ${items.length}</b>.</div>`; if(cfg.onDone) cfg.onDone(); return; }
    const it = items[i]; missed=false;
    let opts = (it.opts||cfg.options).slice(); if(cfg.shuffle) opts=shuffle(opts);
    wrap.innerHTML = `<div class="cq-top"><span>${i+1} / ${items.length}</span><span class="rail"><i style="width:${i/items.length*100}%"></i></span></div>
      <div class="cq-q">${it.q}</div><div class="opts">${opts.map((o,k)=>`<button class="opt" data-k="${k}">${o}</button>`).join("")}</div><div class="cqfb" aria-live="polite"></div>`;
    const fb = wrap.querySelector(".cqfb");
    wrap.querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>{
      const o = opts[+b.dataset.k];
      if(o === it.a){ if(!missed) first++; wrap.querySelectorAll(".opt").forEach(x=>x.disabled=true); b.classList.add("right");
        fb.innerHTML = `<div class="fb good">${it.why}<div class="act-next"><button class="btn btn-sm">${i+1<items.length?"Next":"Finish"}</button></div></div>`;
        fb.querySelector("button").addEventListener("click",()=>{ i++; show(); });
      } else { missed=true; b.classList.add("wrong"); b.disabled=true; shake(b); fb.innerHTML = `<div class="fb bad">${it.hint||cfg.hint||"Try another option."}</div>`; }
    }));
  }
  show();
}
function sortGame(root, cfg, onDone){
  const items = shuffle(cfg.items); let sel=null, placed=0, first=0; const miss=new Set();
  root.innerHTML = `<div class="sub">Items <span class="pill" data-left>${items.length} left</span></div><div class="pool" data-pool></div>
    <div class="buckets">${cfg.buckets.map(b=>`<button class="bucket" data-f="${b.id}"><span class="bh">${b.label}</span><span class="small muted">${b.sub}</span><div class="placedlist"></div></button>`).join("")}</div><div data-fb aria-live="polite"></div>`;
  const pool=root.querySelector("[data-pool]"), fb=root.querySelector("[data-fb]"), left=root.querySelector("[data-left]");
  const nameOf=id=>cfg.buckets.find(b=>b.id===id).label;
  items.forEach(it=>{ const c=el(`<button class="chip">${it.t}</button>`); c._it=it;
    c.addEventListener("click",()=>{ pool.querySelectorAll(".chip").forEach(x=>x.classList.remove("sel")); c.classList.add("sel"); sel=c; fb.innerHTML=`<div class="fb">Selected <b>${it.t}</b> — now tap a box.</div>`; });
    pool.appendChild(c); });
  root.querySelectorAll(".bucket").forEach(b=>b.addEventListener("click",()=>{
    if(!sel){ shake(b); fb.innerHTML=`<div class="fb">Tap an item first, then a box.</div>`; return; }
    const it=sel._it;
    if(it.f===b.dataset.f){ if(!miss.has(it.t)) first++; b.querySelector(".placedlist").appendChild(el(`<span class="placed">${it.t}</span>`)); sel.remove(); sel=null; placed++; left.textContent=(items.length-placed)+" left";
      if(placed===items.length){ pool.innerHTML=`<span class="muted small">All sorted.</span>`; fb.innerHTML=`<div class="fb good">All ${items.length} sorted — first-try correct: <b>${first} of ${items.length}</b>.</div>`; onDone(); }
      else fb.innerHTML=`<div class="fb good"><b>${it.t}</b> → ${nameOf(it.f)}.${it.why?" "+it.why:""}</div>`;
    } else { miss.add(it.t); shake(b); fb.innerHTML=`<div class="fb bad">Not “${nameOf(b.dataset.f)}”. ${cfg.tips[it.f]}</div>`; }
  }));
}
function orderGame(root, events, doneMsg, onDone){
  let next=0; const order=shuffle(events.map((e,i)=>i));
  root.innerHTML = `<div class="order"><div><div class="sub">Steps (shuffled)</div><div class="events" data-evs></div></div>
    <div><div class="sub">Correct order</div><ol class="timeline" data-tl><li class="tl-empty">Click the step that happens first</li></ol></div></div><div data-fb aria-live="polite"></div>`;
  const evs=root.querySelector("[data-evs]"), tl=root.querySelector("[data-tl]"), fb=root.querySelector("[data-fb]");
  order.forEach(i=>{ const b=el(`<button class="opt">${events[i].t}</button>`);
    b.addEventListener("click",()=>{ if(i===next){ b.remove(); if(next===0) tl.innerHTML="";
        tl.appendChild(el(`<li class="tl-item"><span class="tl-num">${next+1}</span><div><div class="tl-ph">${events[i].phase}</div>${events[i].t}</div></li>`)); next++;
        if(next===events.length){ fb.innerHTML=`<div class="fb good">${doneMsg}</div>`; onDone(); } else fb.innerHTML=`<div class="fb good">Correct — what comes next?</div>`;
      } else { shake(b); fb.innerHTML=`<div class="fb bad">Not yet. ${events[next].clue}</div>`; } });
    evs.appendChild(b); });
}
function flipGame(root, cards, doneMsg, onDone){
  const seen=new Set();
  root.innerHTML = `<div class="flips">${cards.map((f,i)=>`<button class="flip" data-i="${i}" aria-label="Flip ${f.name}"><div class="flip-in">
    <div class="face front"><div class="fk">${f.k}</div><div class="fn">${f.name}</div><div class="tap">Tap to flip</div></div>
    <div class="face back"><span class="bt">${f.name}</span>${f.back}</div></div></button>`).join("")}</div><div data-fb aria-live="polite"></div>`;
  const fb=root.querySelector("[data-fb]");
  root.querySelectorAll(".flip").forEach(b=>b.addEventListener("click",()=>{ b.classList.toggle("on"); seen.add(b.dataset.i);
    if(seen.size===cards.length){ if(!root._d){ root._d=true; fb.innerHTML=`<div class="fb good">${doneMsg}</div>`; onDone(); } } else fb.innerHTML=`<div class="fb">${seen.size} of ${cards.length} flipped.</div>`; }));
}
function stepper(root, script, tasks, checkFn, onDone){
  let step=0;
  root.innerHTML = `<div class="seq" id="seq"></div><div class="row wrap" style="margin-top:12px"><button class="btn btn-sm" id="nx">Next step ▸</button><button class="btn btn-quiet btn-sm" id="rs">Restart</button></div>
    ${tasks?`<div class="tasks">${tasks.map((t,k)=>`<div class="tk" id="tk${k}"><span class="tick">✓</span>${t}</div>`).join("")}</div>`:""}<div id="sfb"></div>`;
  const seq=root.querySelector("#seq"), nx=root.querySelector("#nx");
  function label(){ nx.disabled=step>=script.length; nx.textContent=step>=script.length?"Finished":"Next step ▸"; }
  nx.addEventListener("click",()=>{ const s=script[step]; if(!s) return; seq.appendChild(el(`<div class="msg ${s.cls||""}"><div class="d">${s.d}</div><div class="p">${s.p}</div></div>`)); step++; label(); if(step>=script.length && checkFn) checkFn(root,onDone); });
  root.querySelector("#rs").addEventListener("click",()=>{ step=0; seq.innerHTML=""; label(); });
  label();
}

      {q:"“It encrypts all your files and demands a ransom.”", a:W, why:"That’s the harm it causes — a payload."},
      {q:"“It arrives hidden inside a cracked game the user installs.”", a:P, why:"Being disguised to get installed is how it spreads (a trojan vector)."},
      {q:"“It logs every key you press and emails it to the attacker.”", a:W, why:"Stealing keystrokes is a payload action."},
      {q:"“It exploits a flaw in the browser just from visiting a page.”", a:P, why:"A drive-by download is a propagation vector."},

function lessonOutcomeText(m){
  const mod = MODULES[m], cnt=[0,1,2,3,4].filter(i=>S.done[m*5+i]).length;
  const ref = (S.reflect[m]||"").trim();
  let t = `Malicious Software — Lesson ${m+1} outcomes\n`;
  t += `${mod.title}\n`;
  t += `Student: ${S.name} (Roll no. ${S.roll})\n`;
  t += `Activities completed: ${cnt} of 5\n\n`;
  t += `What I learned:\n` + mod.takeaways.map(x=>"• "+x.replace(/<[^>]+>/g,"")).join("\n") + "\n\n";

function shareOutcome(m, statusEl){
  const text = lessonOutcomeText(m);
  const title = `Malicious Software — Lesson ${m+1} outcomes`;
  const showBox = () => {
    let box = statusEl.parentNode.querySelector(".sharebox");
    if(!box){ box = el(`<textarea class="sharebox" readonly></textarea>`); statusEl.parentNode.appendChild(box); }
    box.value = text; box.focus(); box.select();
    statusEl.textContent = "Copied to clipboard. You can also select the text below to copy or paste it anywhere.";
  };
  try{
    if(navigator.share){
      navigator.share({title, text}).then(()=>{ statusEl.textContent = "Shared."; }).catch(()=>{ copyThenBox(); });
      return;
    }
  }catch(e){}
  copyThenBox();
  function copyThenBox(){
    try{
      if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(showBox).catch(showBox); }
      else showBox();
    }catch(e){ showBox(); }
  }
}

function modInfo(m){
  const cnt=[0,1,2,3,4].filter(i=>S.done[m*5+i]).length;
  const unlocked = m===0 || S.maxPos >= m*5-1;
  const started = S.maxPos >= m*5;
  let target=m*5; for(let i=0;i<5;i++){ if(!S.done[m*5+i]){ target=m*5+i; break; } }
  if(target > S.maxPos+1) target = Math.max(m*5, Math.min(S.maxPos, m*5+4));
  return {cnt, unlocked, started, target};
}

    <div class="actwrap ${done?"done":""}" id="act">
      <div class="act-top"><span class="act-label">Activity</span><span class="badge">✓ Completed</span></div>
      <p class="task">${st.task}</p>
      <div id="body"></div>
      <div class="hintarea"><button class="btn btn-quiet btn-sm" id="hintBtn">💡 Hint</button><div id="hints"></div></div>
    </div>
    <div class="stepnav">
      <button class="btn btn-quiet btn-sm" id="back">◂ Back</button>
      <div class="dots" id="dots" aria-hidden="true"></div>
      <button class="btn btn-sm ${done?"":"btn-ghost"}" id="next">${nextLabel(done)} ▸</button>
    </div>
  </section>`;
  const act=document.getElementById("act"), nextBtn=document.getElementById("next");
  function dots(){ document.getElementById("dots").innerHTML=[0,1,2,3,4].map(i=>`<i class="${i===s?"on":""} ${S.done[m*5+i]?"ok":""}"></i>`).join(""); }
  dots();
  const api={ complete(){ if(!S.done[pos]){ S.done[pos]=true; save(); } act.classList.add("done"); nextBtn.classList.remove("btn-ghost"); nextBtn.textContent=nextLabel(true)+" ▸"; dots(); renderTop(); } };
  let hi=0; const hb=document.getElementById("hintBtn"), hbox=document.getElementById("hints");
  hb.addEventListener("click",()=>{ if(hi>=st.hints.length) return; hbox.appendChild(el(`<div class="hintbox"><b>Hint ${hi+1}/${st.hints.length}:</b> ${st.hints[hi]}</div>`)); hi++; if(hi>=st.hints.length){ hb.disabled=true; hb.textContent="No more hints"; } });
  try{ st.activity(document.getElementById("body"), api); }catch(e){ console.error(e); }
  document.getElementById("back").addEventListener("click",()=>go(s>0?()=>screenStep(pos-1):screenOverview));
  nextBtn.addEventListener("click",()=>go(s<4?()=>screenStep(pos+1):()=>screenModuleDone(m)));
}

function screenModuleDone(m){
  mode="done";
  const mod=MODULES[m], cnt=[0,1,2,3,4].filter(i=>S.done[m*5+i]).length;
  app.innerHTML = `<section class="screen stack">
    <div class="bare done-head">
      <div class="check">✓</div>
      <h2>Lesson ${m+1} complete</h2>
      <p class="muted">${mod.title} · ${cnt} of 5 activities</p>
    </div>
    <div class="card">
      <h3>What you learned</h3>
      <ul class="take">${mod.takeaways.map(t=>`<li>${t}</li>`).join("")}</ul>
    </div>
    <div class="card">
      <h3>Reflect on the real world</h3>
      <div class="reflect">
        <div class="prompt">${mod.reflectPrompt}</div>
        <textarea class="ta" id="refl" placeholder="Write a sentence or two…">${esc(S.reflect[m]||"")}</textarea>
        <p class="small muted" id="refstatus" style="margin:6px 0 0">${(S.reflect[m]||"").trim()?"Saved.":"Your note is saved automatically and added to your shared outcomes."}</p>
      </div>
      <div class="share-out">
        <h4 style="margin:16px 0 6px">Share your outcomes</h4>
        <p class="small muted">Create a short summary of this lesson — your activities and reflection — to share with your teacher or group.</p>
        <div class="row wrap" style="margin-top:8px"><button class="btn btn-sm" id="shareBtn">Share outcomes</button><button class="btn btn-quiet btn-sm" id="previewBtn">Preview</button></div>
        <p class="small muted" id="shareStatus" aria-live="polite" style="margin-top:8px"></p>
      </div>
    </div>
    <div class="row wrap center">
      <button class="btn btn-quiet btn-sm" id="toMap">Map</button>
      <button class="btn btn-sm" id="nextMod">${m<2?`Start Lesson ${m+2}`:"Final quiz"} ▸</button>
    </div>
  </section>`;
  const refl=document.getElementById("refl"), refstatus=document.getElementById("refstatus");
  refl.addEventListener("input",()=>{ S.reflect[m]=refl.value; save(); refstatus.textContent = refl.value.trim()?"Saved.":"Your note is saved automatically and added to your shared outcomes."; });
  const status=document.getElementById("shareStatus");
  document.getElementById("shareBtn").addEventListener("click",()=>{ S.reflect[m]=refl.value; save(); shareOutcome(m, status); });
  document.getElementById("previewBtn").addEventListener("click",()=>{ S.reflect[m]=refl.value; save();
    let box=status.parentNode.querySelector(".sharebox"); if(!box){ box=el(`<textarea class="sharebox" readonly></textarea>`); status.parentNode.appendChild(box); }
    box.value=lessonOutcomeText(m); status.textContent="Preview of what will be shared:"; });
  document.getElementById("toMap").addEventListener("click",()=>go(screenOverview));
  document.getElementById("nextMod").addEventListener("click",()=>go(m<2?()=>screenStep((m+1)*5):screenQuizIntro));
}

let Q=null;
function screenQuizIntro(){
  mode="map"; const n=doneCount();
  app.innerHTML = `<section class="screen card">
    <div class="eyebrow">Final quiz</div>
    <h2>Ready, ${esc(S.name.split(" ")[0])}?</h2>
    <table class="marks" style="margin:12px 0"><tbody>
      <tr><th>Questions</th><td>15, from all three lessons</td></tr>
      <tr><th>Marks</th><td>1 each — 15 total</td></tr>
      <tr><th>Pass</th><td>9 / 15</td></tr>
      <tr><th>Rules</th><td>No hints · shuffled · answers lock on submit</td></tr>
      <tr><th>Attempt</th><td>#${S.results.length+1}${S.results.length?` · first was ${S.results[0].score}/15`:""}</td></tr>
    </tbody></table>
    ${n<TOTAL?`<div class="fb">You’ve done ${n}/${TOTAL} activities. Finishing them first will help.</div>`:`<div class="fb good">All 15 activities done — well prepared.</div>`}
    <div class="row wrap" style="margin-top:14px"><button class="btn btn-quiet btn-sm" id="qback">Map</button><button class="btn btn-sm" id="qgo">Start ▸</button></div>
  </section>`;
  document.getElementById("qback").addEventListener("click",()=>go(screenOverview));
  document.getElementById("qgo").addEventListener("click",()=>{ Q={ qs:shuffle(QUIZ).map(q=>Object.assign({},q,{order:shuffle([0,1,2,3])})), i:0, score:0, answers:[], start:Date.now() }; go(screenQuestion); });
}

function screenQuestion(){
  mode="quiz"; const q=Q.qs[Q.i]; let sel=null, locked=false;
  app.innerHTML = `<section class="screen card">
    <div class="row between"><span class="pill">Q${Q.i+1} / ${Q.qs.length}</span><span class="pill">Score ${Q.score}</span></div>
    <div class="rail" style="margin-top:10px"><i style="width:${Q.i/Q.qs.length*100}%"></i></div>
    <p class="small muted" style="margin:12px 0 0">${q.topic}</p>
    <h3 class="qprompt">${q.q}</h3>
    <div class="qopts">${q.order.map((oi,k)=>`<button class="qopt" data-oi="${oi}"><span class="ltr">${"ABCD"[k]}</span><span>${q.o[oi]}</span></button>`).join("")}</div>
    <div id="qfb" aria-live="polite"></div>
    <div class="row end" style="margin-top:14px"><button class="btn btn-sm" id="qsub" disabled>Submit</button></div>
  </section>`;
  const sub=document.getElementById("qsub"), btns=app.querySelectorAll(".qopt");
  btns.forEach(b=>b.addEventListener("click",()=>{ if(locked) return; btns.forEach(x=>x.classList.remove("sel")); b.classList.add("sel"); sel=+b.dataset.oi; sub.disabled=false; }));
  sub.addEventListener("click",()=>{
    if(!locked){ if(sel===null) return; locked=true; const ok=sel===q.a; if(ok) Q.score++;
      Q.answers.push({q:q.q, chosen:q.o[sel], correct:q.o[q.a], ok, ex:q.ex});
      btns.forEach(x=>{ x.disabled=true; const oi=+x.dataset.oi; if(oi===q.a) x.classList.add("right"); else if(oi===sel) x.classList.add("wrong"); x.classList.remove("sel"); });
      document.getElementById("qfb").innerHTML=`<div class="fb ${ok?"good":"bad"}"><b>${ok?"Correct. +1":"Not quite."}</b> ${q.ex}</div>`;
      sub.textContent = Q.i+1<Q.qs.length?"Next ▸":"See result";
    } else if(Q.i+1<Q.qs.length){ Q.i++; go(screenQuestion); } else finishQuiz();
  });
}
function finishQuiz(){
  const r={ score:Q.score, total:15, pct:Math.round(Q.score/15*100), ms:Date.now()-Q.start, date:new Date().toISOString(), attempt:S.results.length+1, activities:doneCount() };
  S.results.push(r); save(); go(screenResult, r, Q.answers);
}
function screenResult(r, answers){
  mode="result"; const g=gradeOf(r.score), pass=r.score>=9;
  const mins=Math.floor(r.ms/60000), secs=Math.round((r.ms%60000)/1000), when=new Date(r.date).toLocaleString();
  const text = `Malicious Software — Activity Result
Name: ${S.name}
Roll no.: ${S.roll}
Quiz: ${r.score}/15 (${r.pct}%) — Grade ${g.g} (${g.t}) — ${pass?"PASS":"Needs revision"}
Activities: ${r.activities}/15
Attempt: ${r.attempt} · ${mins}m ${secs}s · ${when}`;
  app.innerHTML = `<section class="screen stack">
    <div class="card">
      <div class="row between"><span class="eyebrow" style="margin:0">Result</span><span class="pill">Attempt ${r.attempt}</span></div>
      <h2 style="margin:8px 0 14px">Malicious Software result</h2>
      <div class="ring" style="--p:${r.pct}"><div><div><b>${r.score}</b><span>of 15</span></div></div></div>
      <div class="kv">
        <div><small>Student</small><b>${esc(S.name)}</b></div>
        <div><small>Roll no.</small><b>${esc(S.roll)}</b></div>
        <div><small>Grade</small><b>${g.g} — ${g.t}</b></div>
        <div><small>Status</small><b class="${pass?"status-pass":"status-fail"}">${pass?"Pass":"Needs revision"}</b></div>
        <div><small>Activities</small><b>${r.activities} / 15</b></div>
        <div><small>Time</small><b>${mins}m ${secs}s</b></div>
      </div>
      <p class="small muted" style="margin-top:12px">Screenshot this card or copy the text for your teacher.</p>
      <div class="row wrap"><button class="btn btn-sm" id="copy">Copy result</button><button class="btn btn-quiet btn-sm" id="retake">Retake</button><button class="btn btn-quiet btn-sm" id="rmap">Map</button></div>
      <div id="ca"></div>
    </div>
    <div class="card"><h3>Review</h3><ul class="review">${answers.map(a=>`<li><b>${a.q}</b><br><span class="${a.ok?"yes":"no"}">${a.ok?"✓":"✗"} Your answer: ${a.chosen}</span>${a.ok?"":`<br><span class="yes">✓ Correct: ${a.correct}</span>`}<div class="small muted" style="margin-top:3px">${a.ex}</div></li>`).join("")}</ul></div>
  </section>`;
  const copyBtn=document.getElementById("copy");
  copyBtn.addEventListener("click",()=>{
    const fb=()=>{ const ca=document.getElementById("ca"); ca.innerHTML=`<textarea class="sharebox" readonly></textarea>`; const ta=ca.querySelector("textarea"); ta.value=text; ta.focus(); ta.select(); };
    try{ if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(()=>{ copyBtn.textContent="Copied"; setTimeout(()=>copyBtn.textContent="Copy result",2000); }).catch(fb); else fb(); }catch(e){ fb(); }
  });
  document.getElementById("retake").addEventListener("click",()=>go(screenQuizIntro));
  document.getElementById("rmap").addEventListener("click",()=>go(screenOverview));
}

load();
go(screenWelcome);
})();
</script>
</body>
</html>
